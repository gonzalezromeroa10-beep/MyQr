<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Tarjeta pendiente de activación</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7fc; color: #202124; font-family: system-ui, sans-serif; }
    main { margin: 24px; max-width: 440px; padding: 36px; background: white; border-radius: 20px; text-align: center; }
    h1 { font-size: 1.65rem; line-height: 1.25; }
    [hidden] { display: none !important; }
    .tarjeta { display: inline-block; margin: 0 0 12px; padding: 8px 16px; border-radius: 999px; background: #e8f0fe; color: #1967d2; font-weight: 700; }
    p { line-height: 1.6; color: #5f6368; }
  </style>
</head>
<body>
  <main>
    <p id="tarjeta" class="tarjeta" hidden></p>
    <h1>Tarjeta pendiente de activación</h1>
    <p>Esta tarjeta todavía no tiene un negocio asignado.</p>
    <p>Vuelve a escanearla cuando el establecimiento confirme su activación.</p>
  </main>
  <script>
    const id = new URLSearchParams(window.location.search).get('id');
    if (/^\d{3}$/.test(id || '') && Number(id) >= 1 && Number(id) <= 50) {
      const etiqueta = document.getElementById('tarjeta');
      etiqueta.textContent = 'Tarjeta ' + id;
      etiqueta.hidden = false;
      document.title = 'Tarjeta ' + id + ' - Pendiente de activación';
    }
  </script>
</body>
</html>
